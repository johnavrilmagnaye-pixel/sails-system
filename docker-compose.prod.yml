name: sails-crm-production

x-app-environment: &app-environment
  DEBUG: "False"
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.production}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in .env.production}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set CSRF_TRUSTED_ORIGINS in .env.production}
  APP_URL: ${APP_URL:?Set APP_URL in .env.production}
  LANGUAGE_CODE: ${LANGUAGE_CODE:-en}
  TIME_ZONE: ${TIME_ZONE:-UTC}
  DB_NAME: ${DB_NAME:-sails_crm}
  DB_USER: ${DB_USER:-sails_crm}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
  DB_HOST: db
  DB_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  REDIS_CACHE_URL: redis://redis:6379/1
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-True}
  CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-True}
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
  SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
  SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-False}
  SECURE_HSTS_PRELOAD: ${SECURE_HSTS_PRELOAD:-False}
  SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
  SERVER_EMAIL: ${SERVER_EMAIL:-}
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sails_crm}
      POSTGRES_USER: ${DB_USER:-sails_crm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [backend]

  web:
    build: .
    restart: unless-stopped
    command: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      python manage.py compress --force &&
      gunicorn -c gunicorn.conf.py project.wsgi:application"
    environment:
      <<: *app-environment
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
      GUNICORN_LOG_LEVEL: ${GUNICORN_LOG_LEVEL:-info}
    volumes:
      - media_data:/app/media
      - static_data:/app/staticroot
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 8000), 3); s.close()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [backend]

  celery:
    build: .
    restart: unless-stopped
    command: celery -A project worker -l info -Q celery,crm,emails,periodic_starters
    environment: *app-environment
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?Set LETSENCRYPT_EMAIL in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media_data:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
  caddy_data:
  caddy_config:
