{% verbatim %}
<script type="text/template" id="ui-state-tmpl">
<div class="ui-state" :class="'ui-state-' + kind" :role="kind === 'error' ? 'alert' : 'status'" aria-live="polite" aria-atomic="true">
    <i v-if="kind === 'loading'" class="fa fa-circle-o-notch fa-spin" aria-hidden="true"></i>
    <span>{{ message }}</span>
</div>
</script>
{% endverbatim %}
