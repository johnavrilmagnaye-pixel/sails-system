{% verbatim %}
<script type="text/template" id="intro-layout-tmpl">
<ui-state v-if="$loadingRouteData" kind="loading" :message="$root.i18n.gettext('Loading...')"></ui-state>

<div v-if="!$loadingRouteData" class="route-wrapper intro-w">
    <div class="content-header row">
        <div class="steps">
            <div v-for="step in steps" class="step" :class="{completed: step.completed}">
                {{ step.label }}
                <span></span>
            </div>
        </div>
    </div>

    <div class="content-body row">
        <div class="col-md-offset-2 col-md-8 intro-content-w">
            <component is="profile-step" v-if="intro.current_step === introSteps.PROFILE"></component>
            <component is="users-step" v-if="intro.current_step === introSteps.USERS"></component>
            <component is="import-step1" v-if="intro.current_step === introSteps.IMPORT && importStep === 1"></component>
            <component is="import-step2" v-if="intro.current_step === introSteps.IMPORT && importStep === 2" :import-data="importData"></component>
        </div>
    </div>
</div>
</script>


<script type="text/template" id="intro-profile-step-tmpl">
<form class="form-horizontal intro-profile-form" @submit.prevent="onSubmit">
    <h3>{{ $root.i18n.gettext('Enter your details') }}</h3>

    <div v-for="field in form">
        <div class="form-group {{ field.name }}-field-w" :class="{'has-error': !!field.error}">
            <label class="control-label col-md-4">{{ field.label }}</label>
            <div class="col-md-6">
                <component :is="field.editor" :field-data="field"></component>
            </div>
        </div>
    </div>

    <div class="form-group form-actions">
        <div class="col-md-offset-4 col-md-6">
            <button type="submit" class="btn btn-success" v-el:submit>{{ $root.i18n.gettext('Save profile and continue') }}</button>
        </div>
    </div>
</form>
</script>


<script type="text/template" id="intro-users-step-tmpl">
<form class="form-horizontal intro-users-form" @submit.prevent="onSubmit">
    <h3>{{ $root.i18n.gettext('Invite your colleagues and employees') }}</h3>

    <div v-for="field in form">
        <div class="form-group {{ field.name }}-field-w" :class="{'has-error': !!field.error}">
            <label class="control-label col-md-4">{{ $index + 1 }}. {{ field.label }}</label>
            <div class="col-md-7">
                <component :is="field.editor" :field-data="field"></component>
            </div>
        </div>
    </div>
    <div class="form-group form-actions">
        <label class="control-label col-md-4">
            <a href="#" v-if="showMoreLink" @click.prevent="addMore">{{ $root.i18n.gettext('Add another user') }}</a>
        </label>
        <div class="col-md-8">
            <button type="submit" class="btn btn-success" v-el:submit>{{ $root.i18n.gettext('Send invitations') }}</button>
            <span>{{ $root.i18n.gettext('or') }}</span>
            <a href="#" @click.prevent="onSkip">{{ $root.i18n.gettext('Skip') }}</a>
        </div>
    </div>
</form>
</script>


<script type="text/template" id="intro-import-step1-tmpl">
<form class="form-horizontal intro-import-form" @submit.prevent="onSubmit">
    <h3>{{ $root.i18n.gettext('Import your contact database') }}</h3>

    <div class="alert alert-success">{{ $root.i18n.gettext('You can upload an existing contact database from a CSV or Excel file.') }}</div>

    <div class="form-group">
        <div class="col-md-offset-2 col-md-10">
            <input name="file" type="file" required="required" v-el:file-input>
            <p class="help-block">{{ $root.i18n.gettext('Supported formats: CSV, XLS (Excel)') }}</p>
        </div>
    </div>

    <div class="form-group">
        <div class="col-md-offset-2 col-md-10">
            <div class="checkbox checkbox-text">
                <input name="has_header" type="checkbox" id="has_header" v-model="form.has_header">
                <label for="has_header">{{ $root.i18n.gettext('the first row contains field names') }}</label>
            </div>
        </div>
    </div>

    <div class="form-group">
        <div class="col-md-offset-2 col-md-10">
            <div class="checkbox checkbox-text">
                <input name="merge_contacts" type="checkbox" id="merge_contacts" v-model="form.merge_contacts">
                <label for="merge_contacts">{{ $root.i18n.gettext('merge matching contacts') }} <i v-popover class="ion-ios-information-outline"
                       :content="$root.i18n.gettext('If an existing contact has the same comparison field value as an imported contact, they will be merged.')"></i></label>
            </div>
        </div>
    </div>

    <div class="form-group">
        <div class="col-md-offset-2 col-md-10">
            <a href="#" class="toggle-merge-fields" @click.prevent="showMergeFields =! showMergeFields">
                {{ $root.i18n.gettext('Configure contact matching') }}
            </a>
        </div>
    </div>

    <div class="form-group" :class="{'hidden': !showMergeFields}">
        <label for="company_merge_field" class="col-md-offset-2 col-md-4 control-label text-left">
            {{ $root.i18n.gettext('Company comparison field') }}
        </label>
        <div class="col-md-6">
            <select name="company_merge_field" id="company_merge_field" class="form-control"
                    v-model="form.company_merge_field">
                <option v-for="option in companyFieldOptions" :value="option.value">
                    {{ option.text }}
                </option>
            </select>
        </div>
    </div>

    <div class="form-group" :class="{'hidden': !showMergeFields}">
        <label for="person_merge_field" class="col-md-offset-2 col-md-4 control-label text-left">
            {{ $root.i18n.gettext('Contact comparison field') }}
        </label>
        <div class="col-md-6">
            <select name="person_merge_field" id="person_merge_field" class="form-control"
                    v-model="form.person_merge_field">
                <option v-for="option in personFieldOptions" :value="option.value">
                    {{ option.text }}
                </option>
            </select>
        </div>
    </div>

    <div class="form-group form-actions">
        <div class="col-md-offset-2 col-md-10">
            <button type="submit" class="btn btn-success" v-el:submit>{{ $root.i18n.gettext('Continue import') }}</button>
            <span>{{ $root.i18n.gettext('or') }}</span>
            <a href="#" @click.prevent="onSkip">{{ $root.i18n.gettext('Skip and start working') }}</a>
        </div>
    </div>
</form>
</script>


<script type="text/template" id="intro-import-step2-tmpl">
<div class="intro-import-step2-w">
    <h3>{{ $root.i18n.gettext('Import settings') }}</h3>

    <div class="row">
        <div class="col-md-7">
            <p>
                {{ $root.i18n.gettext('The file contains') }} <b>{{ rowsCnt }}</b> {{ $root.i18n.ngettext('row', 'rows', rowsCnt) }}
                {{ $root.i18n.gettext('contain data.') }}
                <span v-if="duplicatesCnt">
                    {{ $root.i18n.gettext('Of these') }} <b>{{ duplicatesCnt }}</b>
                    {{ $root.i18n.ngettext('row', 'rows', duplicatesCnt) }}
                    {{ $root.i18n.gettext('are duplicates.') }}
                </span>
            </p>
            <p>
                {{ $root.i18n.gettext('Match the columns in the file to Sails CRM fields.') }}
                <br>
                {{ $root.i18n.gettext('A column will be ignored if no field is selected for it.') }}
                <br>
                {{ $root.i18n.gettext('One of these two fields must be selected:') }} <b>{{ $root.i18n.gettext('Full name') }}</b> {{ $root.i18n.gettext('or') }} <b>{{ $root.i18n.gettext('Company name') }}</b>.
            </p>
            <br>
        </div>
        <div class="col-md-5">
            <p class="text-right">
                <a href="#" class="import-extra-field-form-toggle" @click.prevent="toggleExtraFieldForm">
                    {{ $root.i18n.gettext('Add new field') }}
                </a>
            </p>

            <form class="form-horizontal import-extra-field-form hidden" v-el:extra-field-form
                  @submit.prevent="addExtraField">
                <div class="form-group" :class="{'has-error': !!form.error}">
                    <label class="control-label col-md-5">{{ $root.i18n.gettext('Field name') }}</label>
                    <div class="col-md-7">
                        <input type="text" name="name" v-model="form.name" class="form-control">
                        <span class="help-block" v-show="!!form.error">{{ form.error }}</span>
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-md-5">{{ $root.i18n.gettext('Use for') }}</label>
                    <div class="col-md-7">
                        <select type="text" name="content_type" v-model="form.contentType" class="form-control">
                            <option v-for="option in contentTypeOptions" :value="option.value">
                                {{ option.text }}
                            </option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-md-offset-5 col-md-7">
                        <button type="submit" class="btn btn-sm btn-success pull-right">{{ $root.i18n.gettext('Add') }}</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="overflow-wrapper">
        <table class="table table-hover fields-table" v-el:fields-table>
            <tbody>
                <tr class="active header-row" v-if="headerRow">
                    <td v-for="cellData in headerRow">{{ cellData }}</td>
                </tr>
                <tr>
                    <td v-for="index in fieldsRange">
                        <select :name="'field_' + index" v-model="fieldsMap['field_' + index]"
                                class="form-control">
                            <option value="">{{ $root.i18n.gettext('Select a field') }}</option>
                            <optgroup :label="$root.i18n.gettext('Company')">
                                <option v-for="fieldOption in companyFieldOptions" :value="fieldOption.value">
                                    {{ fieldOption.text }}
                                </option>
                            </optgroup>
                            <optgroup :label="$root.i18n.gettext('Person')">
                                <option v-for="fieldOption in personFieldOptions" :value="fieldOption.value">
                                    {{ fieldOption.text }}
                                </option>
                            </optgroup>
                            <optgroup :label="$root.i18n.gettext('Common fields')">
                                <option v-for="fieldOption in commonFieldOptions" :value="fieldOption.value">
                                    {{ fieldOption.text }}
                                </option>
                            </optgroup>
                        </select>
                    </td>
                </tr>
                <tr v-for="row in sampleRows">
                    <td v-for="cellData in row">{{ cellData }}</td>
                </tr>
                <tr v-if="rowsCnt > sampleRows.length">
                    <td v-for="field in fieldsRange" class="text-center">
                        <i class="fa fa-ellipsis-h"></i>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="form-actions">
        <button type="button" class="btn btn-default" @click="onCancel">{{ $root.i18n.gettext('Cancel') }}</button>
        <button class="btn btn-success" @click="onSubmit">
            {{ $root.i18n.gettext('Continue import') }}
        </button>
    </div>
</div>
</script>
{% endverbatim %}
