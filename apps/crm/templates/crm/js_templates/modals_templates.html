{% verbatim %}
<script type="text/template" id="company-form-modal-tmpl">
<div class="modal company-form-modal" v-el:modal>
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" @click="cancelModal" :aria-label="$root.i18n.gettext('Close')">
                    <i class="fa fa-times" aria-hidden="true"></i>
                </button>
                <h4>{{ isEdit ? $root.i18n.gettext('Edit') : $root.i18n.gettext('Add new') }} {{ $root.i18n.gettext('company') }}</h4>
            </div>

            <div class="modal-body">
                <form class="form-horizontal" @submit.prevent="submit">
                    <div v-for="field in form">
                        <div class="form-group {{ field.name }}-field-w" :class="{'has-error': !!field.error}">
                            <label class="control-label col-md-4">{{ field.label }}</label>
                            <div class="col-md-8">
                                <component :is="field.editor" :field-data="field"></component>
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-default" @click="cancelModal">{{ $root.i18n.gettext('Cancel') }}</button>

                <div v-if="!isEdit && !isQuickForm" class="btn-group save-and success-dropdown-btn">
                    <button type="button" class="btn btn-success" @click="submit" v-el:submit>{{ $root.i18n.gettext('Save') }}</button>
                    <div class="btn btn-success dropdown-toggle" data-toggle="dropdown">
                        <span class="caret"></span>
                    </div>
                    <ul class="dropdown-menu text-left modal-form-submit-options">
                        <li><a href="#" @click.prevent="submitAndAddMore">{{ $root.i18n.gettext('and add another') }}</a></li>
                        <li><a href="#" @click.prevent="submitAndGoTo">{{ $root.i18n.gettext('and go to company') }}</a></li>
                    </ul>
                </div>
                <button type="button" v-if="isQuickForm" class="btn btn-success" @click="submit" v-el:submit>{{ $root.i18n.gettext('Add') }}</button>
                <button type="button" v-if="isEdit" class="btn btn-success" @click="submit" v-el:submit>{{ $root.i18n.gettext('Save changes') }}</button>
            </div>
        </div>
    </div>
</div>
</script>

<script type="text/template" id="import-contacts-step1-modal-tmpl">
<div class="modal contacts-import-step1-modal" v-el:modal>
    <div class="modal-dialog">
        <div class="modal-content">
            <form class="form form-horizontal" @submit.prevent="onSubmit">
                <div class="modal-header">
                    <button type="button" class="close" @click="cancelModal" :aria-label="$root.i18n.gettext('Close')">
                        <i class="fa fa-times" aria-hidden="true"></i>
                    </button>
                    <h4>{{ $root.i18n.gettext('Import contacts') }}</h4>
                </div>

                <div class="modal-body">
                    <p>
                        {{ $root.i18n.gettext('You can upload your contact database from another application or an Excel file.') }}
                    </p>
                    <p>
                        {{ $root.i18n.gettext('Upload a contact file and specify whether its first row contains field names.') }}
                        <br>
                        {{ $root.i18n.gettext('Then click') }} <b>{{ $root.i18n.gettext('Import') }}</b>.
                    </p>
                    <br>

                    <div class="form-group">
                        <div class="col-md-12">
                            <input name="file" type="file" required="required" v-el:file-input>
                            <p class="help-block">{{ $root.i18n.gettext('Supported formats: CSV, XLS (Excel)') }}</p>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="col-md-12">
                            <div class="checkbox checkbox-text">
                                <input name="has_header" type="checkbox" id="has_header" v-model="form.has_header">
                                <label for="has_header">{{ $root.i18n.gettext('the first row contains field names') }}</label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="col-md-12">
                            <div class="checkbox checkbox-text">
                                <input name="merge_contacts" type="checkbox" id="merge_contacts" v-model="form.merge_contacts">
                                <label for="merge_contacts">{{ $root.i18n.gettext('merge matching contacts') }} <i v-popover class="ion-ios-information-outline"
                                       :content="$root.i18n.gettext('If an existing contact has the same comparison field value as an imported contact, they will be merged.')"></i></label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="col-md-12">
                            <a href="#" class="toggle-merge-fields" @click.prevent="showMergeFields=!showMergeFields">
                                {{ $root.i18n.gettext('Configure contact matching') }}
                            </a>
                        </div>
                    </div>

                    <div class="form-group" :class="{'hidden': !showMergeFields}">
                        <label for="company_merge_field" class="col-md-5 control-label text-left">
                            {{ $root.i18n.gettext('Company comparison field') }}
                        </label>
                        <div class="col-md-5">
                            <select name="company_merge_field" id="company_merge_field" class="form-control"
                                    v-model="form.company_merge_field">
                                <option v-for="option in companyFieldOptions" :value="option.value">
                                    {{ option.text }}
                                </option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group" :class="{'hidden': !showMergeFields}">
                        <label for="person_merge_field" class="col-md-5 control-label text-left">
                            {{ $root.i18n.gettext('Contact comparison field') }}
                        </label>
                        <div class="col-md-5">
                            <select name="person_merge_field" id="person_merge_field" class="form-control"
                                    v-model="form.person_merge_field">
                                <option v-for="option in personFieldOptions" :value="option.value">
                                    {{ option.text }}
                                </option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-default" @click="cancelModal">{{ $root.i18n.gettext('Cancel') }}</button>
                    <button class="btn btn-success" type="submit">
                        {{ $root.i18n.gettext('Import') }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
</script>

<script type="text/template" id="import-contacts-step2-modal-tmpl">
<div class="modal contacts-import-step2-modal" v-el:modal>
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" @click="cancelModal" :aria-label="$root.i18n.gettext('Close')">
                    <i class="fa fa-times" aria-hidden="true"></i>
                </button>
                <h4>{{ $root.i18n.gettext('Import settings') }}</h4>
            </div>

            <div class="modal-body">
                <div class="row">
                    <div class="col-md-6">
                        <p>
                            {{ $root.i18n.gettext('The file contains') }} <b>{{ rowsCnt }}</b> {{ $root.i18n.ngettext('row', 'rows', rowsCnt) }}
                            {{ $root.i18n.gettext('contain data.') }}
                            <span v-if="duplicatesCnt">
                                {{ $root.i18n.gettext('Of these') }} <b>{{ duplicatesCnt }}</b>
                                {{ $root.i18n.ngettext('row', 'rows', duplicatesCnt) }}
                                {{ $root.i18n.gettext('are duplicates.') }}
                            </span>
                        </p>
                        <p>
                            {{ $root.i18n.gettext('Match the columns in the file to Sails CRM fields.') }}
                            <br>
                            {{ $root.i18n.gettext('A column will be ignored if no field is selected for it.') }}
                            <br>
                            {{ $root.i18n.gettext('One of these two fields must be selected:') }} <b>{{ $root.i18n.gettext('Full name') }}</b> {{ $root.i18n.gettext('or') }} <b>{{ $root.i18n.gettext('Company name') }}</b>.
                        </p>
                        <br>
                    </div>
                    <div class="col-md-offset-1 col-md-5">
                        <p class="text-right">
                            <a href="#" class="import-extra-field-form-toggle" @click.prevent="toggleExtraFieldForm">
                                {{ $root.i18n.gettext('Add new field') }}
                            </a>
                        </p>

                        <form class="form-horizontal import-extra-field-form hidden" v-el:extra-field-form
                              @submit.prevent="addExtraField">
                            <div class="form-group" :class="{'has-error': !!form.error}">
